[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!Move "#DashboardAnchorX#" "#DashboardAnchorY#"][!Draggable 0][!ZPos -2]

[Metadata]
Name=Mist Rain Workbench - Desktop Anchor
Author=TANANIS
Information=Lightweight editable desktop text between the clock and today cards.
Version=1.0.0
License=MIT

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc
@Include3=#AnchorDataFile#

[MeasureAnchorText]
Measure=String
String=#AnchorText#
UpdateDivider=-1
DynamicVariables=1

[MeasureAnchorStateText]
Measure=String
String=#AnchorText#
RegExpSubstitute=1
Substitute="^$":"0",".+":"1"
UpdateDivider=-1
DynamicVariables=1

[MeasureAnchorState]
Measure=Calc
Formula=[MeasureAnchorStateText]
IfEqualValue=0
IfEqualAction=[!HideMeter MeterAnchor][!ShowMeter MeterPlaceholder][!Redraw]
IfAboveValue=0
IfAboveAction=[!ShowMeter MeterAnchor][!HideMeter MeterPlaceholder][!Redraw]
UpdateDivider=-1
DynamicVariables=1

[MeasureAnchorInput]
Measure=Plugin
Plugin=InputText
X=0
Y=0
W=#AnchorW#
H=#AnchorH#
FontFace=#FontFace#
FontSize=10
FontColor=#TextColor#
SolidColor=42,42,48,220
StringAlign=Left
FocusDismiss=1
InputLimit=200
DefaultValue=#AnchorText#
Command1=[!WriteKeyValue Variables AnchorText "$UserInput$" "#AnchorDataFile#"][!Refresh]
DynamicVariables=1

[MeterAnchor]
Meter=String
MeterStyle=TextSmall | InteractiveText
MeasureName=MeasureAnchorText
Text=%1
X=0
Y=0
W=#AnchorW#
H=#AnchorH#
FontSize=10
FontColor=#TextFaint#
AntiAlias=1
ClipString=1
StringAlign=LeftCenter
ToolTipText=[MeasureAnchorText]
LeftMouseUpAction=[!CommandMeasure MeasureAnchorInput "ExecuteBatch 1"]
DynamicVariables=1
Hidden=1

[MeterPlaceholder]
Meter=String
MeterStyle=TextSmall | InteractiveText
Text=#AnchorPlaceholder#
X=0
Y=0
W=#AnchorW#
H=#AnchorH#
FontSize=10
FontColor=#TextFaint#
AntiAlias=1
ClipString=1
StringAlign=LeftCenter
ToolTipText=點一下輸入提醒
LeftMouseUpAction=[!CommandMeasure MeasureAnchorInput "ExecuteBatch 1"]
DynamicVariables=1
